
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcrecompile.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pcrecompile.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
